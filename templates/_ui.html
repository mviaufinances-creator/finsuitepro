{# ─── TM Analytics - Finance · shared UI macros ─── #}

{% macro mark(cls='tm-brand__mark') -%}
<svg class="{{ cls }}" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="tmGlass" x1="10" y1="8" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2A4F"/><stop offset="1" stop-color="#0A1022"/>
    </linearGradient>
    <linearGradient id="tmEdge" x1="10" y1="8" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#9FE6FF"/><stop offset="1" stop-color="#3CCBFF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="13" fill="#070B17" stroke="rgba(255,255,255,0.10)"/>
  <path d="M3 27.5 L17 25.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
  <path d="M23 9.5 L35 34 H11 Z" fill="url(#tmGlass)" stroke="url(#tmEdge)" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M23 9.5 L20 34" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>
  <path d="M29.6 23 L45 16.5" stroke="#3CCBFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M30.2 24.3 L45 23.5" stroke="#FFB547" stroke-width="2" stroke-linecap="round"/>
  <path d="M30.8 25.6 L45 30.5" stroke="#9D7BFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="23" cy="9.5" r="1.4" fill="#fff"/>
</svg>
{%- endmacro %}

{% macro brand(size='') -%}
<span class="tm-brand {{ 'tm-brand--lg' if size == 'lg' }}">
  {{ mark() }}
  <span class="tm-brand__text">
    <span class="tm-brand__name">TM <em>Analytics</em></span>
    <span class="tm-brand__sub">Finance</span>
  </span>
</span>
{%- endmacro %}
